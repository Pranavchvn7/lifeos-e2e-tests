# Dependabot opens pull requests when a newer version exists. Each PR runs the smoke tests, so an update that breaks
# something is caught before you merge it. This also keeps the GitHub Actions on current (Node 24) versions.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      playwright:
        patterns: ["@playwright/*", "playwright*"]
      all-other-dependencies:
        patterns: ["*"]
        exclude-patterns: ["@playwright/*", "playwright*"]
